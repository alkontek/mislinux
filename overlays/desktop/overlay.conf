# Physical-machine base: wireless networkd template, fstrim, notes.
# Wired DHCP, resolved, timesyncd and KEYMAP come from 09-config.
# No GUI stack (yet); boards live below desktop/<vendor>/<board>.
name=desktop
title=Local physical machine (console, wired+wireless networkd)
class=local
requires=
parent=
priority=20
status=alpha
kernel=0
# hw: board tools (pci/usb ids, ethtool, alsa, lm-sensors).
# wifi: libnl, wpa_supplicant, iw, wireless-regdb. bluetooth: bluez.
# See docs/overlays.md.
packages=hw,wifi,bluetooth
