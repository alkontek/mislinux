# misl overlay desktop/asus/rog-strix-x570. Notes only: all commented.
#
# RTL8125: mainline r8169 drives it (needs rtl_nic/rtl8125*.fw). If the
# link flaps or stays at 1G, the vendor r8125 driver is the fallback
# (out of tree, not in MISL); then:
#blacklist r8169
#
# Bluetooth (btusb): disable USB autosuspend if the AX200 BT vanishes:
#options btusb enable_autosuspend=0
#
# iwlwifi: power save off / no 11n aggregation when debugging drops:
#options iwlwifi power_save=0
#options iwlmvm power_scheme=1
#options iwlwifi 11n_disable=8
